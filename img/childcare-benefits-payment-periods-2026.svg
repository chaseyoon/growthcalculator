<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 368" width="560" height="368" role="img"><title>2026년 육아 지원금 받는 기간</title><style>text{font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:17px;fill:#1c2a24}.m{fill:#55645c;font-size:15px}.t{font-size:19px;font-weight:700}.g{stroke:#dde5dd}.k{fill:#eef3ee}.bg{fill:#fff}@media(prefers-color-scheme:dark){text{fill:#e6ece8}.m{fill:#9daba3}.g{stroke:#2c3630}.k{fill:#243029}.bg{fill:#1a211d}}</style><rect class="bg" width="560" height="368" rx="10"/><text x="16" y="32" class="t">2026년 육아 지원금 받는 기간</text><rect x="16" y="51" width="14" height="14" rx="3" fill="#1c7a58"/><text x="36" y="63" class="m">가정양육 시 받는 기간</text><rect x="214.20000000000002" y="51" width="14" height="14" rx="3" fill="#7b8a82"/><text x="234.20000000000002" y="63" class="m">출생월에 따라 끝나는 달이 다름</text><line class="g" x1="16.0" x2="16.0" y1="78" y2="332"/><line class="g" x1="97.2" x2="97.2" y1="78" y2="332"/><line class="g" x1="178.5" x2="178.5" y1="78" y2="332"/><line class="g" x1="259.7" x2="259.7" y1="78" y2="332"/><line class="g" x1="340.9" x2="340.9" y1="78" y2="332"/><line class="g" x1="422.2" x2="422.2" y1="78" y2="332"/><line class="g" x1="544.0" x2="544.0" y1="78" y2="332"/><text x="16" y="96">첫만남이용권</text><text x="544" y="96" text-anchor="end" class="m">출생 시 200만·300만원 바우처</text><rect class="k" x="16" y="104" width="528" height="14" rx="7"/><circle cx="16.0" cy="111" r="7" fill="#1c7a58" stroke="#fff" stroke-width="2"/><text x="16" y="146">부모급여 0~11개월</text><text x="544" y="146" text-anchor="end" class="m">월 100만원</text><rect class="k" x="16" y="154" width="528" height="14" rx="7"/><rect x="16.0" y="154" width="40.6" height="14" rx="7" fill="#1c7a58"/><text x="16" y="196">부모급여 12~23개월</text><text x="544" y="196" text-anchor="end" class="m">월 50만원</text><rect class="k" x="16" y="204" width="528" height="14" rx="7"/><rect x="56.6" y="204" width="40.6" height="14" rx="7" fill="#1c7a58"/><text x="16" y="246">아동수당</text><text x="544" y="246" text-anchor="end" class="m">월 10만원 + 지역 추가분, 13세 생일 전달까지</text><rect class="k" x="16" y="254" width="528" height="14" rx="7"/><rect x="16.0" y="254" width="528.0" height="14" rx="7" fill="#1c7a58"/><text x="16" y="296">가정양육수당</text><text x="544" y="296" text-anchor="end" class="m">월 10만원, 취학 전 2월까지</text><rect class="k" x="16" y="304" width="528" height="14" rx="7"/><rect x="97.2" y="304" width="172.6" height="14" rx="7" fill="#1c7a58"/><rect x="269.8" y="304" width="37.2" height="14" rx="7" fill="#7b8a82"/><text x="16.0" y="354" text-anchor="start" class="m">출생</text><text x="97.2" y="354" text-anchor="middle" class="m">2세</text><text x="178.5" y="354" text-anchor="middle" class="m">4세</text><text x="259.7" y="354" text-anchor="middle" class="m">6세</text><text x="340.9" y="354" text-anchor="middle" class="m">8세</text><text x="422.2" y="354" text-anchor="middle" class="m">10세</text><text x="544.0" y="354" text-anchor="end" class="m">13세</text></svg>