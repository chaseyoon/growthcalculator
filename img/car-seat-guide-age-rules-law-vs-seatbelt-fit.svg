<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 368" width="560" height="368" role="img"><title>나이로 본 카시트·안전띠 기준</title><style>text{font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:17px;fill:#1c2a24}.m{fill:#55645c;font-size:15px}.t{font-size:19px;font-weight:700}.g{stroke:#dde5dd}.k{fill:#eef3ee}.bg{fill:#fff}@media(prefers-color-scheme:dark){text{fill:#e6ece8}.m{fill:#9daba3}.g{stroke:#2c3630}.k{fill:#243029}.bg{fill:#1a211d}}</style><rect class="bg" width="560" height="368" rx="10"/><text x="16" y="32" class="t">나이로 본 카시트·안전띠 기준</text><rect x="16" y="51" width="14" height="14" rx="3" fill="#1c7a58"/><text x="36" y="63" class="m">국내 법령·기준</text><rect x="160.8" y="51" width="14" height="14" rx="3" fill="#7b8a82"/><text x="180.8" y="63" class="m">참고(독일·AAP)</text><line class="g" x1="16.0" x2="16.0" y1="78" y2="332"/><line class="g" x1="91.4" x2="91.4" y1="78" y2="332"/><line class="g" x1="166.9" x2="166.9" y1="78" y2="332"/><line class="g" x1="242.3" x2="242.3" y1="78" y2="332"/><line class="g" x1="317.7" x2="317.7" y1="78" y2="332"/><line class="g" x1="393.1" x2="393.1" y1="78" y2="332"/><line class="g" x1="468.6" x2="468.6" y1="78" y2="332"/><line class="g" x1="544.0" x2="544.0" y1="78" y2="332"/><text x="16" y="96">뒤보기·옆보기만 허용</text><text x="544" y="96" text-anchor="end" class="m">15개월 미만 (국내 안전기준)</text><rect class="k" x="16" y="104" width="528" height="14" rx="7"/><rect x="16.0" y="104" width="47.1" height="14" rx="7" fill="#1c7a58"/><text x="16" y="146">카시트 법적 의무</text><text x="544" y="146" text-anchor="end" class="m">6세 미만 (도로교통법)</text><rect class="k" x="16" y="154" width="528" height="14" rx="7"/><rect x="16.0" y="154" width="226.3" height="14" rx="7" fill="#1c7a58"/><text x="16" y="196">안전띠 미착용 과태료 6만원</text><text x="544" y="196" text-anchor="end" class="m">6세 이상 13세 미만</text><rect class="k" x="16" y="204" width="528" height="14" rx="7"/><rect x="242.3" y="204" width="264.0" height="14" rx="7" fill="#1c7a58"/><text x="16" y="246">독일 착용 의무</text><text x="544" y="246" text-anchor="end" class="m">12세까지 또는 150cm 미만</text><rect class="k" x="16" y="254" width="528" height="14" rx="7"/><rect x="16.0" y="254" width="452.6" height="14" rx="7" fill="#7b8a82"/><text x="16" y="296">부스터 없이 안전띠가 맞는 나이</text><text x="544" y="296" text-anchor="end" class="m">대개 8~12세 (AAP)</text><rect class="k" x="16" y="304" width="528" height="14" rx="7"/><rect x="317.7" y="304" width="150.9" height="14" rx="7" fill="#7b8a82"/><text x="16.0" y="354" text-anchor="start" class="m">0세</text><text x="91.4" y="354" text-anchor="middle" class="m">2세</text><text x="166.9" y="354" text-anchor="middle" class="m">4세</text><text x="242.3" y="354" text-anchor="middle" class="m">6세</text><text x="317.7" y="354" text-anchor="middle" class="m">8세</text><text x="393.1" y="354" text-anchor="middle" class="m">10세</text><text x="468.6" y="354" text-anchor="middle" class="m">12세</text><text x="544.0" y="354" text-anchor="end" class="m">14세</text></svg>