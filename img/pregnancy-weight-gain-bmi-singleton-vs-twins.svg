<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 318" width="560" height="318" role="img"><title>임신 전 BMI별 권장 체중 증가</title><style>text{font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:17px;fill:#1c2a24}.m{fill:#55645c;font-size:15px}.t{font-size:19px;font-weight:700}.g{stroke:#dde5dd}.k{fill:#eef3ee}.bg{fill:#fff}@media(prefers-color-scheme:dark){text{fill:#e6ece8}.m{fill:#9daba3}.g{stroke:#2c3630}.k{fill:#243029}.bg{fill:#1a211d}}</style><rect class="bg" width="560" height="318" rx="10"/><text x="16" y="32" class="t">임신 전 BMI별 권장 체중 증가</text><rect x="16" y="51" width="14" height="14" rx="3" fill="#1c7a58"/><text x="36" y="63" class="m">단태아</text><rect x="99" y="51" width="14" height="14" rx="3" fill="#c2410c"/><text x="119" y="63" class="m">쌍둥이 (잠정 기준)</text><line class="g" x1="16.0" x2="16.0" y1="78" y2="282"/><line class="g" x1="97.2" x2="97.2" y1="78" y2="282"/><line class="g" x1="178.5" x2="178.5" y1="78" y2="282"/><line class="g" x1="259.7" x2="259.7" y1="78" y2="282"/><line class="g" x1="340.9" x2="340.9" y1="78" y2="282"/><line class="g" x1="422.2" x2="422.2" y1="78" y2="282"/><line class="g" x1="503.4" x2="503.4" y1="78" y2="282"/><text x="16" y="96">저체중 (BMI 18.5 미만)</text><text x="544" y="96" text-anchor="end" class="m">단태아 12.5~18kg · 쌍둥이 기준 없음</text><rect class="k" x="16" y="104" width="528" height="14" rx="7"/><rect x="269.8" y="104" width="111.7" height="14" rx="7" fill="#1c7a58"/><text x="16" y="146">정상 (BMI 18.5~24.9)</text><text x="544" y="146" text-anchor="end" class="m">단태아 11.5~16kg · 쌍둥이 16.8~24.5kg</text><rect class="k" x="16" y="154" width="528" height="14" rx="7"/><rect x="249.5" y="154" width="91.4" height="14" rx="7" fill="#1c7a58"/><rect x="357.2" y="154" width="156.4" height="14" rx="7" fill="#c2410c"/><text x="16" y="196">과체중 (BMI 25~29.9)</text><text x="544" y="196" text-anchor="end" class="m">단태아 7~11.5kg · 쌍둥이 14.1~22.7kg</text><rect class="k" x="16" y="204" width="528" heigh