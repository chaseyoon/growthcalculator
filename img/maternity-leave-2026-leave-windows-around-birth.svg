<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 268" width="560" height="268" role="img"><title>2026년 출산 전후 휴가 쓰는 시기</title><style>text{font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:17px;fill:#1c2a24}.m{fill:#55645c;font-size:15px}.t{font-size:19px;font-weight:700}.g{stroke:#dde5dd}.k{fill:#eef3ee}.bg{fill:#fff}@media(prefers-color-scheme:dark){text{fill:#e6ece8}.m{fill:#9daba3}.g{stroke:#2c3630}.k{fill:#243029}.bg{fill:#1a211d}}</style><rect class="bg" width="560" height="268" rx="10"/><text x="16" y="32" class="t">2026년 출산 전후 휴가 쓰는 시기</text><rect x="16" y="51" width="14" height="14" rx="3" fill="#7b8a82"/><text x="36" y="63" class="m">출산 전 사용 가능</text><rect x="184.2" y="51" width="14" height="14" rx="3" fill="#1c7a58"/><text x="204.2" y="63" class="m">출산 후 최소 기간</text><rect x="352.4" y="51" width="14" height="14" rx="3" fill="#c2410c"/><text x="372.4" y="63" class="m">배우자 휴가 사용 가능</text><line class="g" x1="16.0" x2="16.0" y1="78" y2="232"/><line class="g" x1="104.0" x2="104.0" y1="78" y2="232"/><line class="g" x1="192.0" x2="192.0" y1="78" y2="232"/><line class="g" x1="280.0" x2="280.0" y1="78" y2="232"/><line class="g" x1="368.0" x2="368.0" y1="78" y2="232"/><line class="g" x1="456.0" x2="456.0" y1="78" y2="232"/><line class="g" x1="544.0" x2="544.0" y1="78" y2="232"/><text x="16" y="96">출산전후휴가 (단태아)</text><text x="544" y="96" text-anchor="end" class="m">90일, 출산 후 45일 이상</text><rect class="k" x="16" y="104" width="528" height="14" rx="7"/><rect x="60.0" y="104" width="132.0" height="14" rx="7" fill="#7b8a82"/><rect x="192.0" y="104" width="132.0" height="14" rx="7" fill="#1c7a58"/><text x="16" y="146">출산전후휴가 (다태아)</text><text x="544" y="146" text-anchor="end" class="m">120일, 출산 후 60일 이상</text><rect class="k" x="16" y="154" width="528" height="14" rx="7"/><rect x="16.0" y="154" width="176.0" height="14" rx="7" fill="#7b8a82"/><rect x="192.0" y="154" width="176.0" height="14" rx="7" fill="#1c7a58"/><text x="16" y="196">배우자 출산전후휴가</text><text x="544" y="196" text-anchor="end" class="m">이 안에서 20일, 3회 분할</text><rect class="k" x="16" y="204" width="528" height="14" rx="7"/><rect x="45.3" y="204" width="498.7" height="14" rx="7" fill="#c2410c"/><text x="16.0" y="254" text-anchor="start" class="m">60일 전</text><text x="104.0" y="254" text-anchor="middle" class="m">30일 전</text><text x="192.0" y="254" text-anchor="middle" class="m">출산</text><text x="280.0" y="254" text-anchor="middle" class="m">30일</text><text x="368.0" y="254" text-anchor="middle" class="m">60일</text><text x="456.0" y="254" text-anchor="middle" class="m">90일</text><text x="544.0" y="254" text-anchor="end" class="m">120일 후</text></svg>