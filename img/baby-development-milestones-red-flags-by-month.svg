<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 618" width="560" height="618" role="img"><title>개월수별 상담이 필요한 발달 신호</title><style>text{font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:17px;fill:#1c2a24}.m{fill:#55645c;font-size:15px}.t{font-size:19px;font-weight:700}.g{stroke:#dde5dd}.k{fill:#eef3ee}.bg{fill:#fff}@media(prefers-color-scheme:dark){text{fill:#e6ece8}.m{fill:#9daba3}.g{stroke:#2c3630}.k{fill:#243029}.bg{fill:#1a211d}}</style><rect class="bg" width="560" height="618" rx="10"/><text x="16" y="32" class="t">개월수별 상담이 필요한 발달 신호</text><rect x="16" y="51" width="14" height="14" rx="3" fill="#c2410c"/><text x="36" y="63" class="m">그 시기까지 못 하면 상담</text><rect x="237.6" y="51" width="14" height="14" rx="3" fill="#7b8a82"/><text x="257.6" y="63" class="m">그 시기에 보이면 상담</text><line class="g" x1="16.0" x2="16.0" y1="78" y2="582"/><line class="g" x1="82.0" x2="82.0" y1="78" y2="582"/><line class="g" x1="148.0" x2="148.0" y1="78" y2="582"/><line class="g" x1="214.0" x2="214.0" y1="78" y2="582"/><line class="g" x1="280.0" x2="280.0" y1="78" y2="582"/><line class="g" x1="412.0" x2="412.0" y1="78" y2="582"/><line class="g" x1="544.0" x2="544.0" y1="78" y2="582"/><text x="16" y="96">머리 가누기</text><text x="544" y="96" text-anchor="end" class="m">3개월</text><rect class="k" x="16" y="104" width="528" height="14" rx="7"/><circle cx="82.0" cy="111" r="7" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="16" y="146">소리 나는 쪽으로 고개 돌리기</text><text x="544" y="146" text-anchor="end" class="m">4개월까지</text><rect class="k" x="16" y="154" width="528" height="14" rx="7"/><circle cx="104.0" cy="161" r="7" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="16" y="196">뒤집기·스스로 미소 짓기</text><text x="544" y="196" text-anchor="end" class="m">5개월</text><rect class="k" x="16" y="204" width="528" height="14" rx="7"/><circle cx="126.0" cy="211" r="7" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="16" y="246">도와주면 앉기·소리 내어 웃기</text><text x="544" y="246" text-anchor="end" class="m">6개월까지</text><rect class="k" x="16" y="254" width="528" height="14" rx="7"/><circle cx="148.0" cy="261" r="7" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="16" y="296">몸이 뻣뻣하거나 흐느적거림</text><text x="544" y="296" text-anchor="end" class="m">4~7개월</text><rect class="k" x="16" y="304" width="528" height="14" rx="7"/><rect x="104.0" y="304" width="66.0" height="14" rx="7" fill="#7b8a82"/><text x="16" y="346">다리로 체중 지탱하기</text><text x="544" y="346" text-anchor="end" class="m">7개월까지</text><rect class="k" x="16" y="354" width="528" height="14" rx="7"/><circle cx="170.0" cy="361" r="7" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="16" y="396">옹알이·까꿍 놀이에 흥미</text><text x="544" y="396" text-anchor="end" class="m">8개월까지</text><rect class="k" x="16" y="404" width="528" height="14" rx="7"/><circle cx="192.0" cy="411" r="7" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="16" y="446">반복 소리·손짓·숨긴 물건 찾기</text><text x="544" y="446" text-anchor="end" class="m">8~12개월</text><rect class="k" x="16" y="454" width="528" height="14" rx="7"/><rect x="192.0" y="454" width="88.0" height="14" rx="7" fill="#c2410c"/><text x="16" y="496">걷기·15개 단어 말하기</text><text x="544" y="496" text-anchor="end" class="m">18개월까지</text><rect class="k" x="16" y="504" width="528" height="14" rx="7"/><circle cx="412.0" cy="511" r="7" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="16" y="546">두 단어 문장·간단한 지시 따르기</text><text x="544" y="546" text-anchor="end" class="m">2세까지</text><rect class="k" x="16" y="554" width="528" height="14" rx="7"/><circle cx="544.0" cy="561" r="7" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="16.0" y="604" text-anchor="start" class="m">0개월</text><text x="82.0" y="604" text-anchor="middle" class="m">3개월</text><text x="148.0" y="604" text-anchor="middle" class="m">6개월</text><text x="214.0" y="604" text-anchor="middle" class="m">9개월</text><text x="280.0" y="604" text-anchor="middle" class="m">12개월</text><text x="412.0" y="604" text-anchor="middle" class="m">18개월</text><text x="544.0" y="604" text-anchor="end" class="m">24개월</text></svg>