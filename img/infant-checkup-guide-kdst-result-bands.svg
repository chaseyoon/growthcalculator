<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 318" width="560" height="318" role="img"><title>K-DST 결과 판정 구간</title><style>text{font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:17px;fill:#1c2a24}.m{fill:#55645c;font-size:15px}.t{font-size:19px;font-weight:700}.g{stroke:#dde5dd}.k{fill:#eef3ee}.bg{fill:#fff}@media(prefers-color-scheme:dark){text{fill:#e6ece8}.m{fill:#9daba3}.g{stroke:#2c3630}.k{fill:#243029}.bg{fill:#1a211d}}</style><rect class="bg" width="560" height="318" rx="10"/><text x="16" y="32" class="t">K-DST 결과 판정 구간</text><rect x="16" y="51" width="14" height="14" rx="3" fill="#1c7a58"/><text x="36" y="63" class="m">양호</text><rect x="84" y="51" width="14" height="14" rx="3" fill="#c2410c"/><text x="104" y="63" class="m">주의·정밀평가 필요</text><line class="g" x1="16.0" x2="16.0" y1="78" y2="282"/><line class="g" x1="104.0" x2="104.0" y1="78" y2="282"/><line class="g" x1="192.0" x2="192.0" y1="78" y2="282"/><line class="g" x1="280.0" x2="280.0" y1="78" y2="282"/><line class="g" x1="368.0" x2="368.0" y1="78" y2="282"/><line class="g" x1="456.0" x2="456.0" y1="78" y2="282"/><line class="g" x1="544.0" x2="544.0" y1="78" y2="282"/><text x="16" y="96">빠른수준</text><text x="544" y="96" text-anchor="end" class="m">+1SD 이상 · 상위 약 16%</text><rect class="k" x="16" y="104" width="528" height="14" rx="7"/><rect x="368.0" y="104" width="176.0" height="14" rx="7" fill="#1c7a58"/><text x="16" y="146">또래수준</text><text x="544" y="146" text-anchor="end" class="m">평균 ±1SD 안</text><rect class="k" x="16" y="154" width="528" height="14" rx="7"/><rect x="192.0" y="154" width="176.0" height="14" rx="7" fill="#1c7a58"/><text x="16" y="196">추적검사 요망</text><text x="544" y="196" text-anchor="end" class="m">평균보다 1~2SD 낮음</text><rect class="k" x="16" y="204" width="528" height="14" rx="7"/><rect x="104.0" y="204" width="88.0" height="14" rx="7" fill="#c2410c"/><text x="16" y="246">심화평가 권고</text><text x="544" y="246" text-anchor="end" c