<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 318" width="560" height="318" role="img"><title>영아 돌연사 위험을 바꾸는 요인</title><style>text{font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:17px;fill:#1c2a24}.m{fill:#55645c;font-size:15px}.t{font-size:19px;font-weight:700}.g{stroke:#dde5dd}.k{fill:#eef3ee}.bg{fill:#fff}@media(prefers-color-scheme:dark){text{fill:#e6ece8}.m{fill:#9daba3}.g{stroke:#2c3630}.k{fill:#243029}.bg{fill:#1a211d}}</style><rect class="bg" width="560" height="318" rx="10"/><text x="16" y="32" class="t">영아 돌연사 위험을 바꾸는 요인</text><rect x="16" y="51" width="14" height="14" rx="3" fill="#c2410c"/><text x="36" y="63" class="m">위험을 높이는 요인</text><rect x="190.8" y="51" width="14" height="14" rx="3" fill="#1c7a58"/><text x="210.8" y="63" class="m">위험을 낮추는 요인</text><line class="g" x1="16.0" x2="16.0" y1="78" y2="282"/><line class="g" x1="82.0" x2="82.0" y1="78" y2="282"/><line class="g" x1="148.0" x2="148.0" y1="78" y2="282"/><line class="g" x1="280.0" x2="280.0" y1="78" y2="282"/><line class="g" x1="412.0" x2="412.0" y1="78" y2="282"/><line class="g" x1="544.0" x2="544.0" y1="78" y2="282"/><text x="16" y="96">옆으로 재우기</text><text x="544" y="96" text-anchor="end" class="m">똑바로 재울 때의 2배</text><rect class="k" x="16" y="104" width="528" height="14" rx="7"/><rect x="16.0" y="104" width="132.0" height="14" rx="7" fill="#c2410c"/><text x="16" y="146">산모 흡연</text><text x="544" y="146" text-anchor="end" class="m">4배</text><rect class="k" x="16" y="154" width="528" height="14" rx="7"/><rect x="16.0" y="154" width="264.0" height="14" rx="7" fill="#c2410c"/><text x="16" y="196">출산 뒤 돌보는 엄마의 음주</text><text x="544" y="196" text-anchor="end" class="m">최대 8배</text><rect class="k" x="16" y="204" width="528" height="14" rx="7"/><rect x="16.0" y="204" width="528.0" height="14" rx="7" fill="#c2410c"/><text x="16" y="246">같은 방, 다른 잠자리</text><text x="544" y="246" text-anchor="end" class="m">최대 50% 감소</text><rect class="k" x="16" y="254" width="528" height="14" rx="7"/><rect x="16.0" y="254" width="33.0" height="14" rx="7" fill="#1c7a58"/><text x="16.0" y="304" text-anchor="start" class="m">0</text><text x="82.0" y="304" text-anchor="middle" class="m">1배</text><text x="148.0" y="304" text-anchor="middle" class="m">2배</text><text x="280.0" y="304" text-anchor="middle" class="m">4배</text><text x="412.0" y="304" text-anchor="middle" class="m">6배</text><text x="544.0" y="304" text-anchor="end" class="m">8배</text></svg>