<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 342" width="560" height="342" role="img"><title>키별 카시트 단계 (15개월 이상)</title><style>text{font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:17px;fill:#1c2a24}.m{fill:#55645c;font-size:15px}.t{font-size:19px;font-weight:700}.g{stroke:#dde5dd}.k{fill:#eef3ee}.bg{fill:#fff}@media(prefers-color-scheme:dark){text{fill:#e6ece8}.m{fill:#9daba3}.g{stroke:#2c3630}.k{fill:#243029}.bg{fill:#1a211d}}</style><rect class="bg" width="560" height="342" rx="10"/><text x="16" y="32" class="t">키별 카시트 단계 (15개월 이상)</text><line class="g" x1="16.0" x2="16.0" y1="52" y2="306"/><line class="g" x1="104.0" x2="104.0" y1="52" y2="306"/><line class="g" x1="192.0" x2="192.0" y1="52" y2="306"/><line class="g" x1="280.0" x2="280.0" y1="52" y2="306"/><line class="g" x1="368.0" x2="368.0" y1="52" y2="306"/><line class="g" x1="456.0" x2="456.0" y1="52" y2="306"/><line class="g" x1="544.0" x2="544.0" y1="52" y2="306"/><text x="16" y="70">뒤보기 카시트</text><text x="544" y="70" text-anchor="end" class="m">76cm 미만</text><rect class="k" x="16" y="78" width="528" height="14" rx="7"/><rect x="16.0" y="78" width="158.4" height="14" rx="7" fill="#1c7a58"/><text x="16" y="120">하네스 카시트(뒤보기 유지 권장)</text><text x="544" y="120" text-anchor="end" class="m">76~100cm</text><rect class="k" x="16" y="128" width="528" height="14" rx="7"/><rect x="174.4" y="128" width="105.6" height="14" rx="7" fill="#1c7a58"/><text x="16" y="170">하네스 또는 등받이 부스터</text><text x="544" y="170" text-anchor="end" class="m">100~125cm</text><rect class="k" x="16" y="178" width="528" height="14" rx="7"/><rect x="280.0" y="178" width="110.0" height="14" rx="7" fill="#1c7a58"/><text x="16" y="220">부스터 (쿠션 포함)</text><text x="544" y="220" text-anchor="end" class="m">125~150cm</text><rect class="k" x="16" y="228" width="528" height="14" rx="7"/><rect x="390.0" y="228" width="110.0" height="14" rx="7" fill="#1c7a58"/><circle cx="478.0" cy="235" r="7" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="16" y="270">성인 안전띠</text><text x="544" y="270" text-anchor="end" class="m">150cm 초과</text><rect class="k" x="16" y="278" width="528" height="14" rx="7"/><rect x="500.0" y="278" width="44.0" height="14" rx="7" fill="#1c7a58"/><text x="16.0" y="328" text-anchor="start" class="m">40cm</text><text x="104.0" y="328" text-anchor="middle" class="m">60cm</text><text x="192.0" y="328" text-anchor="middle" class="m">80cm</text><text x="280.0" y="328" text-anchor="middle" class="m">100cm</text><text x="368.0" y="328" text-anchor="middle" class="m">120cm</text><text x="456.0" y="328" text-anchor="middle" class="m">140cm</text><text x="544.0" y="328" text-anchor="end" class="m">160cm</text></svg>